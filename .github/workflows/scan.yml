name: Scan Buyee

on:
  schedule:
    # Toutes les 30 minutes (dépôt public : minutes GitHub illimitées).
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode test (n'envoie rien sur Discord)"
        type: boolean
        default: false

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Mémoire des annonces déjà envoyées, conservée d'un passage à l'autre.
      - name: Restaurer la mémoire
        uses: actions/cache/restore@v4
        with:
          path: state
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-

      - name: Lancer le scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m scanner --dry-run
          else
            python -m scanner
          fi

      - name: Sauver la mémoire
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: scanner-state-${{ github.run_id }}
